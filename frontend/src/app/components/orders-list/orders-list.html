<div class="flex flex-col h-full min-w-xs items-center justify-between">
  <div class="flex max-w-2xs mb-2 w-full justify-center">
    <app-box-title [title]="'orders'"></app-box-title>
  </div>

  <div class="flex-1 w-full overflow-auto custom-scroll">
    @if (isLoading()) {
      <div class="flex h-full w-full items-center justify-center">
        <div
          class="h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-blue-500"
        ></div>
      </div>
    } @else {
      <ul class="">
        @for (item of orders(); track item.orderId) {
          <li app-menu-order-record [order]="item"></li>
        } @empty {
          <li class="text-center mt-10 text-gray-500">No orders found.</li>
        }
      </ul>
    }
  </div>

  <p class="text-xl text-center w-full mt-8 pb-4">Showing 10 last orders</p>
</div>
