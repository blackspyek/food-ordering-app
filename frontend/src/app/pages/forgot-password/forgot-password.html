<div
  class="bg-white relative z-10 w-full my-8 max-w-md min-w-md rounded-3xl md:border-4 md:border-[#FDA403] shadow-xl p-8 transform transition-all duration-300 hover:scale-[1.01]"
>
  <div class="text-center mb-8">
    <h2 class="text-3xl font-black text-gray-800 mb-2">Forgot Password?</h2>
    <p class="text-gray-500 font-medium">Enter your email to receive a reset link.</p>
  </div>

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-6">
    @if (errorMessage()) {
      <div
        class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
        role="alert"
      >
        <strong class="font-bold">Error: </strong>
        <span class="block sm:inline">{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div
        class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4"
        role="alert"
      >
        <span class="block sm:inline">{{ successMessage() }}</span>
      </div>
    }

    <div class="space-y-1">
      <label for="email" class="block text-sm font-bold text-gray-700 ml-1">Email address</label>
      <div class="relative">
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="example@gmail.com"
          class="w-full px-5 py-3 rounded-xl border-2 border-gray-200 bg-gray-50 focus:bg-white focus:border-[#FDA403] focus:ring-4 focus:ring-[#FDA403]/20 transition-all outline-none font-medium placeholder-gray-400"
          [class.border-red-400]="isFieldInvalid('email')"
          [class.bg-red-50]="isFieldInvalid('email')"
        />
        <div class="absolute right-4 top-3.5 text-gray-400 pointer-events-none">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
            />
          </svg>
        </div>
      </div>

      @if (isFieldInvalid('email')) {
        <p class="text-red-500 text-xs font-bold ml-1">Enter a valid email address.</p>
      }
    </div>

    <button
      type="submit"
      [disabled]="isLoading()"
      class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-gradient-to-r from-[#FDA403] to-[#e69402] hover:from-[#e69402] hover:to-[#cc8402] transition-all shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed transform hover:-translate-y-0.5 active:translate-y-0"
    >
      @if (isLoading()) {
        <span class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
              fill="none"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Sending...
        </span>
      } @else {
        Send Reset Link
      }
    </button>
  </form>

  <div class="mt-8 text-center">
    <p class="text-gray-600 font-medium">
      Remember your password?
      <a routerLink="/login" class="text-[#FDA403] font-bold hover:underline transition-all">
        Back to Login
      </a>
    </p>
  </div>
</div>
